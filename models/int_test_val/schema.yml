version: 2

models:
  - name: int_mortalite_territoriale_sein
    description: >
      Table intermédiaire d'analyse territoriale de la mortalité par cancer du sein chez la femme (2014-2024).
      Elle croise les effectifs de décès par cancer du sein, la mortalité toutes causes, les populations cibles
      et les taux standardisés par région. Conçue pour Power BI avec composantes brutes et ratios précalculés.
    columns:
      - name: id_mortalite_territoriale
        description: "Clé primaire unique du modèle intermédiaire (hash sha256 de annee et code_region)."
        tests:
          - unique
          - not_null

      - name: annee
        description: "Année d'enregistrement du décès (2014 à 2024). [Unité : année civile]"
        tests:
          - not_null

      - name: code_region
        description: "Code INSEE officiel de la région sur 2 caractères. [Unité : code INSEE]"
        tests:
          - not_null

      - name: nom_region
        description: "Libellé normalisé de la région administrative française."
        tests:
          - not_null

      - name: nb_deces_sein
        description: "Nombre total de décès féminins imputables au cancer maligne du sein (C50). [Unité : décès]"

      - name: nb_deces_sein_45_74
        description: "Nombre de décès par cancer du sein chez les femmes de 45 à 74 ans (proche de la cible de dépistage). [Unité : décès]"

      - name: nb_deces_sein_moins_65
        description: "Nombre de décès par cancer du sein chez les femmes de moins de 65 ans (mortalité prématurée). [Unité : décès]"

      - name: nb_deces_sein_65_84
        description: "Nombre de décès par cancer du sein chez les femmes de 65 à 84 ans. [Unité : décès]"

      - name: nb_deces_sein_85_plus
        description: "Nombre de décès par cancer du sein chez les femmes de 85 ans et plus. [Unité : décès]"

      - name: nb_deces_toutes_causes_femmes
        description: "Nombre total de décès féminins toutes causes confondues dans la région. [Unité : décès]"

      - name: population_femmes_total
        description: "Population féminine totale résidant dans la région (source INSEE/Cnam). [Unité : habitantes]"

      - name: population_femmes_50_74_ans
        description: "Population féminine de la tranche d'âge cible du dépistage organisé (50-74 ans). [Unité : personnes]"

      - name: part_cancer_sein_mortalite_totale
        description: "Part du cancer du sein dans la mortalité féminine totale (nb_deces_sein / nb_deces_toutes_causes_femmes). [Unité : ratio 0-1]"

      - name: taux_brut_mortalite_pour_100k_femmes
        description: "Taux brut de mortalité par cancer du sein pour 100 000 femmes de la région. [Unité : décès pour 100 000 femmes]"

      - name: taux_brut_50_74_pour_100k_femmes
        description: "Taux brut de mortalité par cancer du sein pour 100 000 femmes de 50 à 74 ans. [Unité : décès pour 100 000 femmes 50-74 ans]"

      - name: taux_std_moins_65_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour les femmes de moins de 65 ans. [Unité : décès pour 100 000]"

      - name: taux_std_65_84_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour les femmes de 65 à 84 ans. [Unité : décès pour 100 000]"

      - name: taux_std_85_plus_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour les femmes de 85 ans et plus. [Unité : décès pour 100 000]"

      - name: taux_mortalite_std_moyen_pour_100000
        description: "Moyenne des taux standardisés sur l'âge par tranche de référence (France RP 2022). [Unité : décès pour 100 000]"

  - name: int_impact_depistage_territoires
    description: >
      Table intermédiaire d'évaluation de l'impact du dépistage organisé sur la précocité des diagnostics,
      la lourdeur des séjours hospitaliers et la mortalité régionale (2016-2024). Permet de vérifier si une forte
      participation au dépistage s'accompagne d'une réduction des séjours longs et de la mortalité.
    columns:
      - name: id_impact_depistage
        description: "Clé primaire unique du modèle intermédiaire (hash sha256 de annee et code_region)."
        tests:
          - unique
          - not_null

      - name: annee
        description: "Année d'observation (2016 à 2024). [Unité : année civile]"
        tests:
          - not_null

      - name: code_region
        description: "Code INSEE de la région sur 2 caractères. [Unité : code INSEE]"
        tests:
          - not_null

      - name: nom_region
        description: "Libellé de la région administrative française."
        tests:
          - not_null

      - name: taux_participation_depistage_std_pct
        description: "Taux standardisé de participation au dépistage organisé du cancer du sein (moyenne départementale régionale). [Unité : %]"

      - name: nb_cancers_detectes_depistage
        description: "Nombre de cancers détectés dans le cadre du dépistage organisé (Total 50-74 ans, tous rangs). [Unité : cas]"

      - name: nb_cancers_in_situ
        description: "Nombre de cancers canalaires in situ dépistés (stade précoce non infiltrant). [Unité : cas]"

      - name: nb_cancers_inf_ou_egal_10mm
        description: "Nombre de cancers invasifs de petite taille (<= 10 mm) détectés au dépistage. [Unité : cas]"

      - name: part_cancers_in_situ_pct
        description: "Proportion de cancers in situ pour 100 cancers détectés au dépistage organisé. [Unité : %]"

      - name: part_cancers_inf_ou_egal_10mm_pct
        description: "Proportion de tumeurs invasives <= 10 mm pour 100 cancers invasifs de taille connue. [Unité : %]"

      - name: taux_cancers_detectes_pour_1000_femmes
        description: "Taux de cancers détectés pour 1 000 femmes dépistées (indicateur TC01). [Unité : cas pour 1 000 femmes]"

      - name: dms_jours
        description: "Durée moyenne de séjour hospitalier pour cancer du sein dans la région. [Unité : jours]"

      - name: nb_sejours_sein
        description: "Nombre total de séjours hospitaliers pour prise en charge du cancer du sein. [Unité : séjours]"

      - name: nb_sejours_inf_ou_egal_7j
        description: "Nombre de séjours d'hospitalisation de courte durée (inférieure ou égale à 7 jours). [Unité : séjours]"

      - name: nb_sejours_sup_7j
        description: "Nombre de séjours d'hospitalisation prolongée (strictement supérieure à 7 jours). [Unité : séjours]"

      - name: nb_sejours_moins_24h
        description: "Nombre de séjours hospitaliers ambulatoires de moins de 24 heures. [Unité : séjours]"

      - name: nb_patientes
        description: "Effectif de patientes prises en charge pour cancer du sein (affections actives et sous surveillance). [Unité : patientes]"

      - name: part_sejours_courts_pct
        description: "Pourcentage de séjours hospitaliers courts (<= 7 jours) sur le total des séjours sein. [Unité : %]"

      - name: part_sejours_ambulatoires_pct
        description: "Pourcentage de séjours ambulatoires (< 24h) sur le total des séjours sein. [Unité : %]"

      - name: nb_deces_sein
        description: "Nombre total de décès féminins par cancer du sein dans la région. [Unité : décès]"

      - name: taux_mortalite_std_moyen_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour 100 000 femmes. [Unité : décès pour 100 000]"

  - name: int_incidence_age_depistage
    description: >
      Table intermédiaire d'analyse de l'incidence du cancer du sein par tranche d'âge et statut de dépistage (1990-2023).
      Mise au point pour démontrer l'évolution contrastée entre les patientes jeunes de moins de 50 ans (non éligibles au dépistage
      organisé, dont l'incidence a progressé de plus de 54 % depuis 1990) et les femmes de 50 à 74 ans (tranche cible du dépistage,
      stabilisée depuis 2004). Intègre les niveaux quinquennaux et macro, les composantes brutes et les indices base 100 pour Power BI.
    columns:
      - name: id_incidence_age
        description: "Clé primaire unique synthétique (hash sha256 de annee, tranche_age et niveau_agregation)."
        tests:
          - unique
          - not_null

      - name: annee
        description: "Année d'observation de l'incidence de 1990 à 2023. [Unité : année civile]"
        tests:
          - not_null

      - name: tranche_age
        description: "Tranche d'âge quinquennale (ex: '40-44 ans') ou groupe macro de dépistage. [Unité : libellé d'âge]"
        tests:
          - not_null

      - name: niveau_agregation
        description: "Niveau de granularité de la ligne : 'Tranche quinquennale', 'Groupe dépistage' ou 'Total national'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Tranche quinquennale', 'Groupe dépistage', 'Total national']

      - name: groupe_depistage
        description: "Classification au regard du programme national de dépistage : 'Moins de 50 ans (hors dépistage)', '50-74 ans (cible dépistage)', '75 ans et plus (post dépistage)' ou 'Total national'."
        tests:
          - not_null

      - name: est_cible_depistage_organise
        description: "Indicateur booléen spécifiant si la tranche fait partie du dépistage organisé officiel (50-74 ans)."

      - name: age_min
        description: "Borne d'âge inférieure en années révolues. [Unité : années]"

      - name: age_max
        description: "Borne d'âge supérieure en années révolues (nulle pour 85 ans et plus et total). [Unité : années]"

      - name: ordre_affichage
        description: "Entier séquentiel de tri chronologique (1 à 18 pour les tranches, 101 à 103 pour les groupes, 200 pour le total) à utiliser comme colonne de tri dans Power BI."
        tests:
          - not_null

      - name: nb_nouveaux_cas
        description: "Nombre annuel de nouveaux cas incidents de cancer du sein diagnostiqués en France. [Unité : cas]"

      - name: nb_personnes_annees
        description: "Population féminine exposée au risque (effectif en personnes-années). [Unité : personnes-années]"

      - name: total_cas_annee
        description: "Nombre total de nouveaux cas incidents tous âges confondus pour l'année en France. [Unité : cas]"

      - name: taux_incidence_brut
        description: "Taux d'incidence brut pour 100 000 femmes (nb_nouveaux_cas * 100 000 / nb_personnes_annees). [Unité : cas pour 100 000 femmes]"

      - name: taux_incidence_ic_inf
        description: "Borne inférieure de l'intervalle de confiance à 95 % du taux d'incidence brut. [Unité : cas pour 100 000 femmes]"

      - name: taux_incidence_ic_sup
        description: "Borne supérieure de l'intervalle de confiance à 95 % du taux d'incidence brut. [Unité : cas pour 100 000 femmes]"

      - name: part_cas_annee_pct
        description: "Part en pourcentage de cette tranche d'âge dans l'ensemble des nouveaux cas de l'année. [Unité : %]"

      - name: indice_base_1990
        description: "Indice d'évolution de l'incidence normalisé en base 100 sur l'année de départ 1990. [Unité : indice base 100 en 1990]"

      - name: indice_base_2004
        description: "Indice d'évolution normalisé en base 100 sur 2004 (année de généralisation du dépistage organisé en France). [Unité : indice base 100 en 2004]"

      - name: evolution_pct_depuis_1990
        description: "Taux de croissance global de l'incidence depuis 1990 ((taux - taux_1990) / taux_1990 * 100). [Unité : %]"

      - name: evolution_pct_depuis_2004
        description: "Taux de croissance de l'incidence depuis la généralisation du dépistage en 2004 ((taux - taux_2004) / taux_2004 * 100). [Unité : %]"

      - name: evolution_annuelle_pct
        description: "Variation relative en pourcentage par rapport à l'année immédiatement précédente ((taux_N - taux_N-1) / taux_N-1 * 100). [Unité : %]"


