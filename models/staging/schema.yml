version: 2

sources:
  - name: data_brute
    description: "Jeu de données BigQuery contenant les données brutes sur l'oncologie, les séjours hospitaliers et l'incidence (cancer du sein et autres cancers)."
    database: cancer-du-sein-513216
    schema: Data_brute
    tables:
      - name: charge_france
        description: "Statistiques hospitalières nationales par pathologie et durée de séjour."
      - name: charge_region
        description: "Statistiques hospitalières régionales par pathologie et durée de séjour."
      - name: depenses_onco
        description: "Dépenses remboursées par l'Assurance Maladie par type de cancer, statut et poste."
      - name: depenses_patho
        description: "Dépenses détaillées par code de pathologie (TOP) et poste."
      - name: df_radiologie_final
        description: "Annuaire des centres de radiologie et de mammographie en France."
      - name: dms_france
        description: "Durée moyenne de séjour (DMS) au niveau national par pathologie."
      - name: dms_region
        description: "Durée moyenne de séjour (DMS) au niveau régional par pathologie."
      - name: effectifs_region
        description: "Effectifs de patients et prévalence par région et pathologie."
      - name: incidence_france
        description: "Incidence nationale du cancer du sein (taux bruts et standardisés 1990-2023)."
      - name: incidence_france_age
        description: "Incidence nationale du cancer du sein par classe d'âge."
      - name: incidence_region
        description: "Incidence et mortalité régionales estimées (2007-2016)."
      - name: pop_cible_regions
        description: "Population cible féminine (50-74 ans) et part cible par région et année."
      - name: pop_regions_age
        description: "Population régionale par sexe et tranche d'âge détaillée (1975-2026)."

  - name: depistage
    description: "Données de dépistage organisé du cancer du sein (Santé Publique France / Insee)."
    database: cancer-du-sein-513216
    schema: depistage
    tables:
      - name: France_Participation_AGE_2024_2025
        description: "Participation au dépistage organisé par tranche d'âge pour la campagne 2024-2025."
      - name: France_Participation_Evolution_2005_2025
        description: "Évolution annuelle de la participation au dépistage (2005 à 2025)."
      - name: TAUX_PARTICIPATION_INSEE_BRUT_TRANCHES_AGE_2005_2025
        description: "Taux de participation brut par période biennale et tranche d'âge (2005 à 2025)."

models:
  - name: stg_charge_france
    description: "Staging des données de séjours hospitaliers en France (niveaux national)."
    columns:
      - name: annee
        tests:
          - not_null
      - name: libelle_pathologie
        tests:
          - not_null
      - name: famille_tumeur
        tests:
          - not_null

  - name: stg_charge_region
    description: "Staging des données de séjours hospitaliers par région."
    columns:
      - name: nom_region
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: libelle_pathologie
        tests:
          - not_null

  - name: stg_dms_france
    description: "Staging de la durée moyenne de séjour (DMS) au niveau France."
    columns:
      - name: annee
        tests:
          - not_null
      - name: libelle_pathologie
        tests:
          - not_null

  - name: stg_dms_region
    description: "Staging de la durée moyenne de séjour (DMS) par région."
    columns:
      - name: nom_region
        tests:
          - not_null
      - name: annee
        tests:
          - not_null
      - name: libelle_pathologie
        tests:
          - not_null

  - name: stg_depenses_onco
    description: "Staging des dépenses de santé en oncologie par statut et poste."
    columns:
      - name: annee
        tests:
          - not_null
      - name: localisation_cancer
        tests:
          - not_null
      - name: statut_cancer
        tests:
          - not_null
      - name: poste_depense
        tests:
          - not_null

  - name: stg_depenses_patho
    description: "Staging des dépenses par pathologie (clef id_depense unique)."
    columns:
      - name: id_depense
        tests:
          - unique
          - not_null

  - name: stg_effectifs_region
    description: "Staging des effectifs de patients et taux de prévalence par région."
    columns:
      - name: id_effectif
        tests:
          - unique
          - not_null
      - name: code_region
        tests:
          - not_null
      - name: nom_region
        tests:
          - not_null

  - name: stg_incidence_france
    description: "Staging de l'incidence nationale historique du cancer du sein chez la femme."
    columns:
      - name: annee
        tests:
          - unique
          - not_null
      - name: sexe
        tests:
          - not_null

  - name: stg_incidence_france_age
    description: "Staging de l'incidence nationale par classe d'âge."
    columns:
      - name: annee
        tests:
          - not_null
      - name: tranche_age
        tests:
          - not_null

  - name: stg_incidence_region
    description: "Staging des taux d'incidence et mortalité par région."
    columns:
      - name: code_region
        tests:
          - unique
          - not_null
      - name: nom_region
        tests:
          - not_null

  - name: stg_centres_radiologie
    description: "Staging de l'annuaire des centres de radiologie et de dépistage."
    columns:
      - name: id_centre_radiologie
        tests:
          - unique
          - not_null
      - name: code_region
        tests:
          - not_null
      - name: code_departement
        tests:
          - not_null
      - name: nom_centre_radiologie
        tests:
          - not_null

  - name: stg_depistage_age_2024_2025
    description: "Staging de la participation au dépistage 2024-2025 par département et région."
    columns:
      - name: id_depistage_zone
        tests:
          - unique
          - not_null
      - name: nom_zone_geographique
        tests:
          - not_null
      - name: type_zone_geographique
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['National', 'Région', 'Département']

  - name: stg_depistage_evolution_2005_2025
    description: "Staging normalisé (au format long/unpivoted par année) de l'évolution du dépistage 2005-2025."
    columns:
      - name: id_depistage_evolution
        tests:
          - unique
          - not_null
      - name: nom_zone_geographique
        tests:
          - not_null
      - name: annee
        tests:
          - not_null

  - name: stg_depistage_tranches_age_2005_2025
    description: "Staging normalisé par période biennale et tranche d'âge du dépistage 2005-2025."
    columns:
      - name: id_depistage_tranche_age
        tests:
          - unique
          - not_null
      - name: nom_zone_geographique
        tests:
          - not_null
      - name: tranche_age
        tests:
          - not_null
      - name: periode_biennale
        tests:
          - not_null

  - name: stg_pop_cible_regions
    description: "Staging de la population cible féminine (50-74 ans) et part cible par région et année."
    columns:
      - name: id_pop_cible_region
        description: "Empreinte SHA-256 de la clé (annee, code_region)."
        tests:
          - unique
          - not_null
      - name: annee
        tests:
          - not_null
      - name: code_region
        tests:
          - not_null
      - name: nom_region
        tests:
          - not_null
      - name: population_femmes_50_74_ans
        tests:
          - not_null
      - name: population_femmes_total
        tests:
          - not_null
      - name: part_cible_pct
        tests:
          - not_null

  - name: stg_pop_regions_age
    description: "Staging de la population régionale par sexe et tranche d'âge détaillée."
    columns:
      - name: id_pop_region_age
        description: "Empreinte SHA-256 de la clé (annee, code_region, code_sexe, tranche_age)."
        tests:
          - unique
          - not_null
      - name: annee
        tests:
          - not_null
      - name: code_region
        tests:
          - not_null
      - name: nom_region
        tests:
          - not_null
      - name: code_sexe
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['E', 'F', 'H']
      - name: sexe
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Ensemble', 'Femmes', 'Hommes']
      - name: tranche_age
        tests:
          - not_null
      - name: population
        tests:
          - not_null
