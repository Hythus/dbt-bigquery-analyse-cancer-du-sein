          - not_null
      - name: ecart_std_vs_france_100k
        description: "Écart (région - France) du taux standardisé tous âges [Unité : Décès / 100k femmes]."
        tests:
          - not_null
      - name: rang_annuel_region
        description: "Rang annuel de la région (1 = taux standardisé le plus élevé) [Unité : Rang]."
        tests:
          - not_null
      - name: moyenne_std_2014_2022
        description: "Moyenne régionale du taux standardisé sur 2014-2022 [Unité : Décès / 100k femmes]."
        tests:
          - not_null
