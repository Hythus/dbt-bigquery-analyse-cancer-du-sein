        tests:
          - not_null
      - name: mediane_std_2014_2022
        description: "Médiane régionale du taux standardisé sur 2014-2022 [Unité : Décès / 100k femmes]."
        tests:
          - not_null
      - name: q3_std_2014_2022
        description: "3e quartile (75e percentile) du taux standardisé sur 2014-2022 [Unité : Décès / 100k femmes]."
        tests:
