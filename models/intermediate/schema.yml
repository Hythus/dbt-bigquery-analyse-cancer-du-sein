version: 2

models:
  - name: int_charge_hospitaliere_sein
    description: "Table intermédiaire consolidée combinant la charge hospitalière, la durée moyenne de séjour (DMS), l'effectif de patientes et les composantes brutes oncologiques pour le cancer du sein par région (2018-2024)."
    columns:
      - name: id_charge_hospitaliere
        description: "Empreinte SHA-256 unique combinant l'année et le code région."
        tests:
          - unique
          - not_null
      - name: annee
        description: "Année d'activité hospitalière (2018-2024) [Unité : Année (AAAA)]."
        tests:
          - not_null
      - name: code_region
        description: "Code officiel Insee de la région sur 2 caractères [Unité : Code textuel]."
        tests:
          - not_null
      - name: libelle_region
        description: "Nom standardisé de la région administrative."
        tests:
          - not_null
      - name: pathologie
        description: "Libellé de la pathologie oncologique ciblée ('Tumeur maligne du sein')."
        tests:
          - not_null
      - name: dms_jours
        description: "Durée moyenne de séjour (DMS) hospitalière [Unité : Jours]."
        tests:
          - not_null
      - name: nb_sejours_moins_24h
        description: "Nombre de séjours hospitaliers ambulatoires ou de moins de 24 heures [Unité : Nombre de séjours]."
        tests:
          - not_null
      - name: nb_sejours_inf_ou_egal_7j
        description: "Nombre de séjours hospitaliers d'une durée inférieure ou égale à 7 jours (1j à 7j inclus) [Unité : Nombre de séjours]."
        tests:
          - not_null
      - name: nb_sejours_sup_7j
        description: "Nombre de séjours hospitaliers d'une durée strictement supérieure à 7 jours (8j et plus) [Unité : Nombre de séjours]."
        tests:
          - not_null
      - name: nbre_hospitalisation
        description: "Nombre total d'hospitalisations enregistrées pour le cancer du sein, tous types de séjours confondus [Unité : Nombre d'hospitalisations]."
        tests:
          - not_null
      - name: nb_sejours_sein
        description: "Numérateur brut DAX : nombre d'hospitalisations pour cancer du sein de la région [Unité : Nombre de séjours]."
        tests:
          - not_null
      - name: nb_sejours_onco_total
        description: "Dénominateur brut DAX : volume total d'hospitalisations pour toutes pathologies oncologiques de la région [Unité : Nombre de séjours]."
        tests:
          - not_null
      - name: ratio_cancer_sein_patho_onco
        description: "Ratio d'activité oncologique précalculé à la ligne (nb_sejours_sein / nb_sejours_onco_total) [Unité : Ratio / Proportion entre 0 et 1]."
        tests:
          - not_null
      - name: nb_patientes
        description: "Effectif régional de patientes prises en charge pour cancer du sein (actif et sous surveillance) [Unité : Nombre de patientes]."
        tests:
          - not_null
      - name: taux_sejours_par_patiente
        description: "Taux moyen d'hospitalisation par patiente atteinte (nbre_hospitalisation / nb_patientes) [Unité : Nombre moyen de séjours par patiente]."
        tests:
          - not_null

  - name: int_depenses_regionales_sein
    description: "Table intermédiaire consolidée estimant les dépenses régionales d'Assurance Maladie pour le cancer du sein, l'effectif de patientes et les composantes brutes oncologiques par grande catégorie (2018-2024)."
    columns:
      - name: id_depense_regionale
        description: "Empreinte SHA-256 unique combinant l'année, le code région et le type de dépense."
        tests:
          - unique
          - not_null
      - name: annee
        description: "Année des dépenses remboursées (2018-2024) [Unité : Année (AAAA)]."
        tests:
          - not_null
      - name: code_region
        description: "Code officiel Insee de la région sur 2 caractères [Unité : Code textuel]."
        tests:
          - not_null
      - name: libelle_region
        description: "Nom standardisé de la région administrative."
        tests:
          - not_null
      - name: pathologie
        description: "Pathologie concernée ('Cancer du sein de la femme')."
        tests:
          - not_null
      - name: type_de_depense
        description: "Grande catégorie de dépense de santé ('Hospitalisations (tous secteurs)', 'Soins de ville', 'Prestations en espèces')."
        tests:
          - not_null
      - name: montant_euros
        description: "Montant régional estimé des dépenses remboursées pour le cancer du sein [Unité : Euros (€)]."
        tests:
          - not_null
      - name: montant_sein_euros
        description: "Numérateur brut DAX : montant des dépenses remboursées pour le cancer du sein [Unité : Euros (€)]."
        tests:
          - not_null
      - name: montant_onco_total_euros
        description: "Dénominateur brut DAX : montant total des dépenses oncologiques régionales pour cette catégorie de soins [Unité : Euros (€)]."
        tests:
          - not_null
      - name: ratio_cancer_sein_patho_onco
        description: "Part des dépenses précalculée à la ligne (montant_sein_euros / montant_onco_total_euros) [Unité : Ratio / Proportion entre 0 et 1]."
        tests:
          - not_null
      - name: nb_patientes
        description: "Effectif régional de patientes prises en charge pour cancer du sein (actif et sous surveillance) [Unité : Nombre de patientes]."
        tests:
          - not_null
      - name: cout_moyen_par_patiente_euros
        description: "Dépense moyenne remboursée par patiente régionale pour cette catégorie de soins (montant_euros / nb_patientes) [Unité : Euros (€) par patiente]."
        tests:
          - not_null

  - name: int_nb_centre_taux_depistage_region
    description: >
      Table intermédiaire croisant l'offre territoriale de centres de radiologie/mammographie (stg_centres_radiologie),
      la population cible féminine (stg_pop_cible_regions) et la participation standardisée au dépistage organisé du cancer du sein
      par région et période biennale (stg_depistage_taux_standardise_2016_2025), incluant l'estimation du volume de participantes.
    columns:
      - name: id_centre_taux_depistage
        description: "Clé primaire unique synthétique (hash sha256 de periode_biennale et code_region)."
        tests:
          - unique
          - not_null

      - name: periode_biennale
        description: "Période biennale du taux de dépistage (ex: '2016-2017'). [Unité : période biennale]"
        tests:
          - not_null

      - name: annee_fin_periode
        description: "Année de fin de la période biennale pour l'affichage chronologique (2017 à 2025). [Unité : année civile]"
        tests:
          - not_null

      - name: code_region
        description: "Code INSEE officiel de la région sur 2 caractères. [Unité : code INSEE]"
        tests:
          - not_null

      - name: nom_region
        description: "Libellé normalisé de la région administrative française."
        tests:
          - not_null

      - name: nb_centre
        description: "Nombre de centres de radiologie/mammographie recensés dans la région. [Unité : centres]"
        tests:
          - not_null

      - name: femmes_50_74
        description: "Population féminine cible du dépistage organisé (50 à 74 ans) dans la région pour l'année de fin de période. [Unité : personnes]"
        tests:
          - not_null

      - name: femmes_total
        description: "Population féminine totale de la région pour l'année de fin de période. [Unité : habitantes]"
        tests:
          - not_null

      - name: moy_taux_std_participation
        description: "Moyenne régionale des taux départementaux standardisés de participation au dépistage organisé. [Unité : %]"
        tests:
          - not_null

      - name: nb_femmes_participantes_estime
        description: "Estimation du nombre de femmes de 50 à 74 ans ayant participé au dépistage organisé (femmes_50_74 * moy_taux_std_participation / 100). [Unité : femmes]"
        tests:
          - not_null

      - name: nb_femmes_non_participantes_estime
        description: "Estimation du nombre de femmes cibles (50-74 ans) n'ayant pas participé au dépistage organisé (femmes_50_74 - nb_femmes_participantes_estime). [Unité : femmes]"
        tests:
          - not_null

      - name: nb_femmes_50_74_par_centre
        description: "Ratio de pression démographique par centre : nombre moyen de femmes cibles (50-74 ans) par centre de radiologie (femmes_50_74 / nb_centre). [Unité : femmes par centre]"
        tests:
          - not_null

  - name: int_carte_centres_depistage_ville
    description: >
      Table intermédiaire cartographique à la maille communale (ville) croisant l'implantation géographique des centres
      de radiologie/mammographie (stg_centres_radiologie), la participation régionale au dépistage organisé
      (stg_depistage_taux_standardise_2016_2025) et la densité de population régionale estimée (stg_pop_regions_age / superficie INSEE).
      Conçue pour les visuels cartographiques (Azure Maps / Carte choroplèthe + bulles) dans Power BI.
    columns:
      - name: id_carte_centre_ville
        description: "Clé primaire unique synthétique (hash sha256 de periode_biennale, code_region, code_departement et ville)."
        tests:
          - unique
          - not_null

      - name: periode_biennale
        description: "Période biennale du taux de dépistage (ex: '2023-2024'). [Unité : période biennale]"
        tests:
          - not_null

      - name: annee_fin_periode
        description: "Année de fin de la période biennale (2017 à 2025). [Unité : année civile]"
        tests:
          - not_null

      - name: code_region
        description: "Code INSEE officiel de la région sur 2 caractères. [Unité : code INSEE]"
        tests:
          - not_null

      - name: nom_region
        description: "Libellé normalisé de la région administrative française."
        tests:
          - not_null

      - name: code_departement
        description: "Code INSEE du département sur 2 ou 3 caractères. [Unité : code département]"
        tests:
          - not_null

      - name: nom_departement
        description: "Libellé du département d'implantation."
        tests:
          - not_null

      - name: ville
        description: "Commune d'implantation du ou des centres de radiologie."
        tests:
          - not_null

      - name: localisation_complete
        description: "Chaîne géographique complète ('VILLE, Département, France') optimisée pour le géocodage sans ambiguïté dans Power BI."
        tests:
          - not_null

      - name: nb_centre
        description: "Nombre de centres de radiologie/mammographie recensés dans cette commune. [Unité : centres]"
        tests:
          - not_null

      - name: nb_centres_total_region
        description: "Nombre total de centres de radiologie dans la région d'appartenance (pour comparaison et info-bulles). [Unité : centres]"
        tests:
          - not_null

      - name: moy_taux_std_participation
        description: "Moyenne régionale des taux départementaux standardisés de participation au dépistage organisé. [Unité : %]"
        tests:
          - not_null

      - name: population_regionale
        description: "Population totale estimée de la région (tous sexes, tous âges) pour l'année de fin de période. [Unité : habitants]"
        tests:
          - not_null

      - name: superficie_region_km2
        description: "Superficie terrestre officielle INSEE/IGN de la région. [Unité : km²]"
        tests:
          - not_null

      - name: densite_population_hab_km2
        description: "Densité de population régionale estimée (population_regionale / superficie_region_km2). [Unité : hab/km²]"
        tests:
          - not_null

      - name: densite_centres_region_pour_100k_hab
        description: "Densité régionale d'équipement en centres de radiologie pour 100 000 habitants. [Unité : centres pour 100 000 hab]"
        tests:
          - not_null

  - name: int_mortalite_territoriale_sein
    description: >
      Table intermédiaire d'analyse territoriale de la mortalité par cancer du sein chez la femme (2014-2024).
      Elle croise les effectifs de décès par cancer du sein, la mortalité toutes causes, les populations cibles
      et les taux standardisés par région. Conçue pour Power BI avec composantes brutes et ratios précalculés.
    columns:
      - name: id_mortalite_territoriale
        description: "Clé primaire unique du modèle intermédiaire (hash sha256 de annee et code_region)."
        tests:
          - unique
          - not_null

      - name: annee
        description: "Année d'enregistrement du décès (2014 à 2024). [Unité : année civile]"
        tests:
          - not_null

      - name: code_region
        description: "Code INSEE officiel de la région sur 2 caractères. [Unité : code INSEE]"
        tests:
          - not_null

      - name: nom_region
        description: "Libellé normalisé de la région administrative française."
        tests:
          - not_null

      - name: nb_deces_sein
        description: "Nombre total de décès féminins imputables au cancer maligne du sein (C50). [Unité : décès]"

      - name: nb_deces_sein_45_74
        description: "Nombre de décès par cancer du sein chez les femmes de 45 à 74 ans (proche de la cible de dépistage). [Unité : décès]"

      - name: nb_deces_sein_moins_65
        description: "Nombre de décès par cancer du sein chez les femmes de moins de 65 ans (mortalité prématurée). [Unité : décès]"

      - name: nb_deces_sein_65_84
        description: "Nombre de décès par cancer du sein chez les femmes de 65 à 84 ans. [Unité : décès]"

      - name: nb_deces_sein_85_plus
        description: "Nombre de décès par cancer du sein chez les femmes de 85 ans et plus. [Unité : décès]"

      - name: nb_deces_toutes_causes_femmes
        description: "Nombre total de décès féminins toutes causes confondues dans la région. [Unité : décès]"

      - name: population_femmes_total
        description: "Population féminine totale résidant dans la région (source INSEE/Cnam). [Unité : habitantes]"

      - name: population_femmes_50_74_ans
        description: "Population féminine de la tranche d'âge cible du dépistage organisé (50-74 ans). [Unité : personnes]"

      - name: part_cancer_sein_mortalite_totale
        description: "Part du cancer du sein dans la mortalité féminine totale (nb_deces_sein / nb_deces_toutes_causes_femmes). [Unité : ratio 0-1]"

      - name: taux_brut_mortalite_pour_100k_femmes
        description: "Taux brut de mortalité par cancer du sein pour 100 000 femmes de la région. [Unité : décès pour 100 000 femmes]"

      - name: taux_brut_50_74_pour_100k_femmes
        description: "Taux brut de mortalité par cancer du sein pour 100 000 femmes de 50 à 74 ans. [Unité : décès pour 100 000 femmes 50-74 ans]"

      - name: taux_std_moins_65_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour les femmes de moins de 65 ans. [Unité : décès pour 100 000]"

      - name: taux_std_65_84_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour les femmes de 65 à 84 ans. [Unité : décès pour 100 000]"

      - name: taux_std_85_plus_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour les femmes de 85 ans et plus. [Unité : décès pour 100 000]"

      - name: taux_mortalite_std_moyen_pour_100000
        description: "Moyenne des taux standardisés sur l'âge par tranche de référence (France RP 2022). [Unité : décès pour 100 000]"

  - name: int_impact_depistage_territoires
    description: >
      Table intermédiaire d'évaluation de l'impact du dépistage organisé sur la précocité des diagnostics,
      la lourdeur des séjours hospitaliers et la mortalité régionale (2016-2024). Permet de vérifier si une forte
      participation au dépistage s'accompagne d'une réduction des séjours longs et de la mortalité.
    columns:
      - name: id_impact_depistage
        description: "Clé primaire unique du modèle intermédiaire (hash sha256 de annee et code_region)."
        tests:
          - unique
          - not_null

      - name: annee
        description: "Année d'observation (2016 à 2024). [Unité : année civile]"
        tests:
          - not_null

      - name: code_region
        description: "Code INSEE de la région sur 2 caractères. [Unité : code INSEE]"
        tests:
          - not_null

      - name: nom_region
        description: "Libellé de la région administrative française."
        tests:
          - not_null

      - name: taux_participation_depistage_std_pct
        description: "Taux standardisé de participation au dépistage organisé du cancer du sein (moyenne départementale régionale). [Unité : %]"

      - name: nb_cancers_detectes_depistage
        description: "Nombre de cancers détectés dans le cadre du dépistage organisé (Total 50-74 ans, tous rangs). [Unité : cas]"

      - name: nb_cancers_in_situ
        description: "Nombre de cancers canalaires in situ dépistés (stade précoce non infiltrant). [Unité : cas]"

      - name: nb_cancers_inf_ou_egal_10mm
        description: "Nombre de cancers invasifs de petite taille (<= 10 mm) détectés au dépistage. [Unité : cas]"

      - name: part_cancers_in_situ_pct
        description: "Proportion de cancers in situ pour 100 cancers détectés au dépistage organisé. [Unité : %]"

      - name: part_cancers_inf_ou_egal_10mm_pct
        description: "Proportion de tumeurs invasives <= 10 mm pour 100 cancers invasifs de taille connue. [Unité : %]"

      - name: taux_cancers_detectes_pour_1000_femmes
        description: "Taux de cancers détectés pour 1 000 femmes dépistées (indicateur TC01). [Unité : cas pour 1 000 femmes]"

      - name: dms_jours
        description: "Durée moyenne de séjour hospitalier pour cancer du sein dans la région. [Unité : jours]"

      - name: nb_sejours_sein
        description: "Nombre total de séjours hospitaliers pour prise en charge du cancer du sein. [Unité : séjours]"

      - name: nb_sejours_inf_ou_egal_7j
        description: "Nombre de séjours d'hospitalisation de courte durée (inférieure ou égale à 7 jours). [Unité : séjours]"

      - name: nb_sejours_sup_7j
        description: "Nombre de séjours d'hospitalisation prolongée (strictement supérieure à 7 jours). [Unité : séjours]"

      - name: nb_sejours_moins_24h
        description: "Nombre de séjours hospitaliers ambulatoires de moins de 24 heures. [Unité : séjours]"

      - name: nb_patientes
        description: "Effectif de patientes prises en charge pour cancer du sein (affections actives et sous surveillance). [Unité : patientes]"

      - name: part_sejours_courts_pct
        description: "Pourcentage de séjours hospitaliers courts (<= 7 jours) sur le total des séjours sein. [Unité : %]"

      - name: part_sejours_ambulatoires_pct
        description: "Pourcentage de séjours ambulatoires (< 24h) sur le total des séjours sein. [Unité : %]"

      - name: nb_deces_sein
        description: "Nombre total de décès féminins par cancer du sein dans la région. [Unité : décès]"

      - name: taux_mortalite_std_moyen_pour_100000
        description: "Taux de mortalité standardisé sur l'âge pour 100 000 femmes. [Unité : décès pour 100 000]"

  - name: int_incidence_age_depistage
    description: >
      Table intermédiaire d'analyse de l'incidence du cancer du sein par tranche d'âge et statut de dépistage (1990-2023).
      Filtrée dès 20 ans (exclusion des tranches < 20 ans à incidence quasi nulle). Mise au point pour démontrer l'évolution
      contrastée entre les patientes jeunes de 20 à 49 ans (non éligibles au dépistage organisé, dont l'incidence adulte a progressé
      de +55,7 % depuis 1990) et les femmes de 50 à 74 ans (tranche cible du dépistage, stabilisée depuis 2004). Intègre les niveaux
      quinquennaux et macro, les composantes brutes et les indices base 100 pour Power BI.
    columns:
      - name: id_incidence_age
        description: "Clé primaire unique synthétique (hash sha256 de annee, tranche_age et niveau_agregation)."
        tests:
          - unique
          - not_null

      - name: annee
        description: "Année d'observation de l'incidence de 1990 à 2023. [Unité : année civile]"
        tests:
          - not_null

      - name: tranche_age
        description: "Tranche d'âge quinquennale (ex: '40-44 ans') ou groupe macro de dépistage. [Unité : libellé d'âge]"
        tests:
          - not_null

      - name: niveau_agregation
        description: "Niveau de granularité de la ligne : 'Tranche quinquennale', 'Groupe dépistage' ou 'Total national'."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Tranche quinquennale', 'Groupe dépistage', 'Total national']

      - name: groupe_depistage
        description: "Classification au regard du programme national de dépistage : '20-49 ans (hors dépistage)', '50-74 ans (cible dépistage)', '75 ans et plus (post dépistage)' ou 'Total national'."
        tests:
          - not_null

      - name: est_cible_depistage_organise
        description: "Indicateur booléen spécifiant si la tranche fait partie du dépistage organisé officiel (50-74 ans)."

      - name: age_min
        description: "Borne d'âge inférieure en années révolues (>= 20 ans). [Unité : années]"

      - name: age_max
        description: "Borne d'âge supérieure en années révolues (nulle pour 85 ans et plus et total). [Unité : années]"

      - name: ordre_affichage
        description: "Entier séquentiel de tri chronologique (1 à 14 pour les tranches 20-24 à 85+, 101 à 103 pour les groupes, 200 pour le total) à utiliser comme colonne de tri dans Power BI."
        tests:
          - not_null

      - name: nb_nouveaux_cas
        description: "Nombre annuel de nouveaux cas incidents de cancer du sein diagnostiqués en France. [Unité : cas]"

      - name: nb_personnes_annees
        description: "Population féminine exposée au risque (effectif en personnes-années). [Unité : personnes-années]"

      - name: total_cas_annee
        description: "Nombre total de nouveaux cas incidents tous âges confondus pour l'année en France. [Unité : cas]"

      - name: taux_incidence_brut
        description: "Taux d'incidence brut pour 100 000 femmes (nb_nouveaux_cas * 100 000 / nb_personnes_annees). [Unité : cas pour 100 000 femmes]"

      - name: taux_incidence_ic_inf
        description: "Borne inférieure de l'intervalle de confiance à 95 % du taux d'incidence brut. [Unité : cas pour 100 000 femmes]"

      - name: taux_incidence_ic_sup
        description: "Borne supérieure de l'intervalle de confiance à 95 % du taux d'incidence brut. [Unité : cas pour 100 000 femmes]"

      - name: part_cas_annee_pct
        description: "Part en pourcentage de cette tranche d'âge dans l'ensemble des nouveaux cas de l'année. [Unité : %]"

      - name: indice_base_1990
        description: "Indice d'évolution de l'incidence normalisé en base 100 sur l'année de départ 1990. [Unité : indice base 100 en 1990]"

      - name: indice_base_2004
        description: "Indice d'évolution normalisé en base 100 sur 2004 (année de généralisation du dépistage organisé en France). [Unité : indice base 100 en 2004]"

      - name: evolution_pct_depuis_1990
        description: "Taux de croissance global de l'incidence depuis 1990 ((taux - taux_1990) / taux_1990 * 100). [Unité : %]"

      - name: evolution_pct_depuis_2004
        description: "Taux de croissance de l'incidence depuis la généralisation du dépistage en 2004 ((taux - taux_2004) / taux_2004 * 100). [Unité : %]"

      - name: evolution_annuelle_pct
        description: "Variation relative en pourcentage par rapport à l'année immédiatement précédente ((taux_N - taux_N-1) / taux_N-1 * 100). [Unité : %]"

  - name: int_comparatif_sein_vs_tous_cancers
    description: >
      Table intermédiaire consolidée comparant le cancer du sein et l'ensemble des tumeurs malignes (tous cancers confondus)
      par année (2015-2024), région (18 régions) et tranche d'âge quinquennale féminine/totale (15 tranches dès 25 ans, soit 2 700 lignes).
      Croise les effectifs de mortalité CépiDc (tumeur maligne du sein vs 2.1 Tumeurs malignes ventilés au prorata démographique Insee)
      avec les effectifs exacts de patients en prise en charge active Ameli (Femmes et Tous sexes).
    columns:
      - name: id_comparatif_sein_onco
        description: "Clé primaire SHA-256 unique par triplet (annee, code_region, code_tranche_age_5)."
        tests:
          - unique
          - not_null
      - name: annee
        description: "Année civile (2015 à 2024). [Unité : année]"
        tests:
          - not_null
      - name: code_region
        description: "Code officiel Insee sur 2 caractères de la région. [Unité : code INSEE]"
